name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the coverage badge on main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TeMDA
        uses: actions/checkout@v5

      - name: Checkout PrivacyDSLv3 (PrivacyModel)
        uses: actions/checkout@v5
        with:
          repository: Tijana994/PrivacyDSLv3
          path: PrivacyDSLv3

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JaCoCo
        run: |
          curl -sSfL -o jacoco.zip https://repo1.maven.org/maven2/org/jacoco/jacoco/0.8.12/jacoco-0.8.12.zip
          unzip -q jacoco.zip -d jacoco

      - name: Build and run tests
        run: bash ci/run-tests.sh PrivacyDSLv3 jacoco

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: build/coverage/html
          if-no-files-found: ignore

      - name: Generate coverage badge
        id: badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/coverage/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lines (instructions) | Branches |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "print('| %.1f%% | %.1f%% |' % (float('${{ steps.badge.outputs.coverage }}')*100, float('${{ steps.badge.outputs.branches }}')*100))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full HTML report: download the *coverage-report* artifact of this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain .github/badges)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "Update coverage badge"
            git push
          fi
